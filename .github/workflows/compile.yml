name: Compile contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The SilverScript workspace declares rust-version = "1.85.0", but that
          # declaration is stale and 1.85.0 cannot build the revision pinned in
          # SILVERSCRIPT_COMMIT. Two independent constraints raise the floor:
          #   - the pinned revision uses let-chains, stabilised in Rust 1.88;
          #   - its rusty-kaspa v2.0.1 dependencies (kaspa-txscript, kaspa-hashes,
          #     kaspa-consensus-core, …) all declare rust-version = "1.91.0".
          # Pinned rather than "stable" so the toolchain stays reproducible
          # alongside SILVERSCRIPT_COMMIT.
          toolchain: "1.91.0"

      - name: Build pinned SilverScript compiler
        shell: bash
        run: |
          compiler_commit="$(cat SILVERSCRIPT_COMMIT)"
          git clone https://github.com/kaspanet/silverscript.git "$RUNNER_TEMP/silverscript"
          git -C "$RUNNER_TEMP/silverscript" checkout --detach "$compiler_commit"
          cargo build \
            --manifest-path "$RUNNER_TEMP/silverscript/Cargo.toml" \
            --release \
            --package silverscript-lang \
            --bin silverc

      - name: Compile all contracts
        env:
          SILVERC: ${{ runner.temp }}/silverscript/target/release/silverc
        run: ./tests/compile.sh
